<script>
    const carouselTrack = document.querySelector('.carousel-track');
    const carouselSlides = carouselTrack.querySelectorAll('.carousel-slide:not([aria-hidden="true"])');
    const carouselDuration = 95000;
    const carouselStep = carouselDuration / carouselSlides.length;
    let carouselResumeTimer;

    document.querySelectorAll('.carousel-arrow').forEach((button) => {
        button.addEventListener('click', () => {
            let animation = carouselTrack.getAnimations()[0];

            if (!animation) {
                animation = carouselTrack.animate(
                    [{ transform: 'translateX(0)' }, { transform: 'translateX(-50%)' }],
                    { duration: carouselDuration, iterations: Infinity }
                );
            }

            animation.pause();
            const currentTime = Number(animation.currentTime) || 0;
            const direction = button.classList.contains('carousel-arrow--next') ? 1 : -1;
            animation.currentTime = (currentTime + direction * carouselStep + carouselDuration) % carouselDuration;

            window.clearTimeout(carouselResumeTimer);
            carouselResumeTimer = window.setTimeout(() => animation.play(), 2000);
        });
    });
</script>
